<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="4" fill="#050508"/>
  
  <!-- MX stays in place -->
  <text x="11" y="20" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" text-anchor="middle" fill="#ffffff">MX</text>
  
  <!-- 1 falls from top and lands next to MX -->
  <text x="24" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" text-anchor="middle" fill="#a855f7">
    1
    <animate 
      attributeName="y" 
      from="-5" 
      to="20" 
      dur="0.6s" 
      begin="0s" 
      fill="freeze"
      calcMode="spline"
      keySplines="0.34 1.56 0.64 1"
    />
  </text>
</svg>
