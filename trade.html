<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade | MX1 Capital</title>
    <meta name="description" content="Start trading with MX1 Capital - AI-driven quantitative investment.">
    
    <!-- Favicon -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="og-image.jpg">
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #0a0a0a;
            --deep: #050508;
            --surface: #111114;
            --accent: #a855f7;
            --accent-bright: #c084fc;
            --accent-dim: #a855f733;
            --cyan: #00e5cc;
            --text: #ffffff;
            --text-dim: #888888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--deep);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        .trade-page {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .trade-video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            opacity: 0.6;
        }

        .trade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(5,5,8,0.5) 0%, rgba(5,5,8,0.3) 50%, rgba(5,5,8,0.7) 100%);
        }

        .trade-content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }

        .trade-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 0.3em;
            margin-bottom: 3rem;
        }

        .trade-logo span {
            color: var(--accent);
        }

        .trade-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            letter-spacing: 0.1em;
            margin-bottom: 1.5rem;
            line-height: 1.1;
        }

        .trade-desc {
            font-size: 1.1rem;
            font-weight: 300;
            color: var(--text-dim);
            line-height: 1.8;
            margin-bottom: 3rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .trade-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 400px;
            margin: 0 auto;
        }

        .trade-input {
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .trade-input:focus {
            border-color: var(--accent);
            background: rgba(168, 85, 247, 0.05);
        }

        .trade-input::placeholder {
            color: var(--text-dim);
        }

        .trade-submit {
            padding: 1rem 2rem;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .trade-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--accent);
            transition: left 0.4s ease;
            z-index: -1;
        }

        .trade-submit:hover::before {
            left: 0;
        }

        .trade-submit:hover {
            color: var(--deep);
        }

        .back-link {
            position: absolute;
            top: 2rem;
            left: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            transition: color 0.3s ease;
            z-index: 100;
        }

        .back-link:hover {
            color: var(--accent);
        }

        .back-link svg {
            width: 18px;
            height: 18px;
        }

        .mute-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 48px;
            height: 48px;
            background: rgba(5, 5, 8, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 50%;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .mute-btn:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .mute-btn svg {
            width: 20px;
            height: 20px;
            color: var(--accent);
        }

        .mute-btn .mute-icon-off {
            display: none;
        }

        .mute-btn.muted .mute-icon-on {
            display: none;
        }

        .mute-btn.muted .mute-icon-off {
            display: block;
        }

        @media (max-width: 768px) {
            .trade-content {
                padding: 1.5rem;
            }

            .trade-title {
                font-size: clamp(2rem, 10vw, 3rem);
            }

            .trade-desc {
                font-size: 0.95rem;
            }

            .back-link {
                top: 1rem;
                left: 1rem;
            }

            .mute-btn {
                bottom: 1.5rem;
                right: 1rem;
                width: 40px;
                height: 40px;
            }

            .mute-btn svg {
                width: 16px;
                height: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="trade-page">
        <video class="trade-video" autoplay muted loop playsinline id="tradeVideo">
            <source src="trade-bg.mp4" type="video/mp4">
        </video>
        <div class="trade-overlay"></div>

        <a href="index.html" class="back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            BACK
        </a>

        <!-- Mute Button -->
        <button class="mute-btn" id="muteBtn" aria-label="Mute audio">
            <svg class="mute-icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
            <svg class="mute-icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <line x1="23" y1="9" x2="17" y2="15"/>
                <line x1="17" y1="9" x2="23" y2="15"/>
            </svg>
        </button>

        <div class="trade-content">
            <div class="trade-logo">MX<span>1</span></div>
            <h1 class="trade-title">START TRADING</h1>
            <p class="trade-desc">Join MX1 Capital and access AI-powered quantitative trading strategies. Enter your details below to get started.</p>
            
            <form class="trade-form" id="tradeForm">
                <input type="text" class="trade-input" placeholder="Full Name" required>
                <input type="email" class="trade-input" placeholder="Email Address" required>
                <input type="tel" class="trade-input" placeholder="Phone Number">
                <button type="submit" class="trade-submit">GET STARTED</button>
            </form>
        </div>
    </div>

    <script>
        const tradeVideo = document.getElementById('tradeVideo');
        const muteBtn = document.getElementById('muteBtn');
        const tradeForm = document.getElementById('tradeForm');
        
        // Auto-unmute after a short delay (user came from main site, so interaction happened)
        setTimeout(() => {
            tradeVideo.muted = false;
            muteBtn.classList.remove('muted');
        }, 500);
        
        // Mute button toggle
        muteBtn.addEventListener('click', () => {
            const isMuted = muteBtn.classList.toggle('muted');
            tradeVideo.muted = isMuted;
        });
        
        // Form submission - redirect to trading platform
        tradeForm.addEventListener('submit', (e) => {
            e.preventDefault();
            // Redirect to trading platform
            window.location.href = 'http://47.131.13.248/';
        });
    </script>
</body>
</html>
